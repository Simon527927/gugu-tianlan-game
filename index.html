        const touch = state.input.id === null
          ? event.changedTouches[0]
          : Array.from(event.changedTouches).find(item => item.identifier === state.input.id) || event.changedTouches[0];
        return { x: touch.clientX, y: touch.clientY, id: touch.identifier };
      }
      return { x: event.clientX, y: event.clientY, id: "mouse" };
    }

    function handleStickStart(event) {
      event.preventDefault();
      if (!state.running || state.paused || state.finished) return;
      if (state.input.active) return;
      const point = getPoint(event);
      state.input.active = true;
      state.input.id = point.id;
      updateJoystick(point.x, point.y);
    }

    function handleStickMove(event) {
      if (!state.input.active) return;
      event.preventDefault();
      if (!state.running || state.paused || state.finished) {
        resetJoystick();
        return;
      }
      const point = getPoint(event);
      updateJoystick(point.x, point.y);
    }

    function handleStickEnd(event) {
      if (!state.input.active) return;
      event.preventDefault();
      if (event.changedTouches && !Array.from(event.changedTouches).some(item => item.identifier === state.input.id)) return;
      state.input.active = false;
      state.input.id = null;
      state.input.x = 0;
      state.input.y = 0;
      state.input.power = 0;
      stick.style.transform = "translate(-50%, -50%)";
    }

    function updateJoystick(clientX, clientY) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const max = rect.width * 0.32;
      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const len = Math.hypot(dx, dy) || 1;
      const limited = Math.min(len, max);
      dx = dx / len * limited;
      dy = dy / len * limited;
      state.input.x = dx / max;
      state.input.y = dy / max;
      state.input.power = Math.min(1, len / max);
      stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function selectDifficulty(key) {
      state.gameMode = "challenge";
      state.selectedDifficulty = key;
      state.config = difficulties[key];
      resetCatDash();
      document.querySelectorAll(".difficulty-btn").forEach(button => {
        button.classList.toggle("selected", button.dataset.difficulty === key);
      });
      loadBestScore();
      updateDashButton();
    }

    function startChallengeGame() {
      state.gameMode = "challenge";
      state.config = difficulties[state.selectedDifficulty];
      state.campaignRun = false;
      state.runTotalScore = 0;
      state.runTotalTime = 0;
      state.runStars = 0;
      state.runRatings = [];
      startGame();
    }

    function showLevelSelect() {
      renderLevelList();
      showScreen("level");
    }

    function startLevelGame(index, campaignRun) {
      state.gameMode = "level";
      state.currentLevelIndex = clamp(index, 0, levels.length - 1);
      state.campaignRun = Boolean(campaignRun);
      if (state.currentLevelIndex === 0 && state.campaignRun) {
        state.runTotalScore = 0;
        state.runTotalTime = 0;
        state.runStars = 0;
        state.runRatings = [];
      }
      state.config = levels[state.currentLevelIndex];
      startGame();
    }

    function startGame() {
      state.config = getCurrentConfig();
      showScreen("game");
      setupRound();
      state.paused = false;
      state.finished = false;
      cancelAnimationFrame(state.rafId);
      state.running = false;
      startOpeningCountdown();
      render();
    }

    function startOpeningCountdown() {
      clearOpeningCountdown();
      state.gameState = "countdown";
      state.countdownActive = true;
      state.countdownToken += 1;
      const token = state.countdownToken;
      const steps = ["3", "2", "1", "开始！"];
      countdownOverlay.classList.add("active");
      pauseBtn.disabled = true;

      const showStep = index => {
        if (token !== state.countdownToken || state.screen !== "game" || state.finished) return;
        countdownText.textContent = steps[index];
        countdownText.style.animation = "none";
        void countdownText.offsetWidth;
        countdownText.style.animation = "countdownPop 0.6s ease-out";
        playSound(index < 3 ? "tick" : "start");
        if (index < steps.length - 1) {
          state.countdownTimer = window.setTimeout(() => showStep(index + 1), 760);
        } else {
          state.countdownTimer = window.setTimeout(() => finishOpeningCountdown(token), 620);
        }
      };
      showStep(0);
      updateDashButton();
    }

    function finishOpeningCountdown(token) {
      if (token !== state.countdownToken || state.screen !== "game" || state.finished) return;
      countdownOverlay.classList.remove("active");
      pauseBtn.disabled = false;
      state.countdownActive = false;
      state.gameState = "playing";
      state.running = true;
      state.lastTime = performance.now();
      cancelAnimationFrame(state.rafId);
      state.rafId = requestAnimationFrame(gameLoop);
      updateDashButton();
    }

    function clearOpeningCountdown() {
      state.countdownToken += 1;
      clearTimeout(state.countdownTimer);
      state.countdownTimer = null;
      state.countdownActive = false;
      countdownOverlay.classList.remove("active");
      pauseBtn.disabled = false;
    }

    function setupRound() {
      measureRoom();
      const cfg = state.config;
      state.elapsed = 0;
      state.timeLeft = cfg.time;
      state.score = 0;
      state.lastBeepSecond = null;
      clearTimeout(state.endTimer);
      state.cat.size = 56;
      state.mouse.size = 40;
      createObstacles();
      createTunnels();
      const catSpawn = getSafeSpawnPosition(state.cat.size / 2, "cat");
      state.cat.x = catSpawn.x;
      state.cat.y = catSpawn.y;
      state.cat.vx = 0;
      state.cat.vy = 0;
      state.cat.angle = 0;
      resetCatDash();
      resetItems();
      randomizeMousePosition();
      setWanderDirection();
      state.mouse.wanderTimer = 0.4;
      state.mouse.sprintTimer = 0;
      state.mouse.sprintCooldown = 0;
      state.mouse.sprinting = false;
      state.mouse.dodgeTimer = 0;
      state.mouse.dodgeCooldown = 0.7;
      state.mouse.dodgeX = 0;
      state.mouse.dodgeY = 0;
      state.mouse.dangerMeter = 0;
      state.mouse.blockedCount = 0;
      state.mouse.stuckTimer = 0;
      resetTunnelState();
      state.mouse.lastX = state.mouse.x;
      state.mouse.lastY = state.mouse.y;
      mouseEl.classList.remove("sprinting");
      mouseEl.style.animationPlayState = "running";
      particleLayer.innerHTML = "";
      difficultyPill.textContent = state.gameMode === "level" ? currentLevelLabel() : cfg.label;
      updateDashButton();
      renderItems();
    }

    function resetCatDash() {
      state.cat.isDashing = false;
      state.cat.dashTimer = 0;
      state.cat.dashCooldownTimer = 0;
      state.cat.dashReady = true;
      state.cat.lastMoveDirX = 1;
      state.cat.lastMoveDirY = 0;
      state.cat.speedBoostTimer = 0;
      catEl.classList.remove("dashing");
      catEl.classList.remove("speed-boosted");
      catStatus.classList.add("hidden");
    }

    function resetItems() {
      state.items.speedShoe.active = false;
      state.items.cheese.active = false;
      state.items.speedShoe.spawnTimer = state.config.itemsEnabled && state.config.speedShoeEnabled ? randomRange(...state.config.speedShoeSpawnRange) : Infinity;
      state.items.cheese.spawnTimer = state.config.itemsEnabled && state.config.cheeseEnabled ? randomRange(...state.config.cheeseSpawnRange) : Infinity;
      state.mouse.cheeseBoostTimer = 0;
      state.mouse.recentlyAteCheeseTimer = 0;
      mouseEl.classList.remove("cheese-boosted");
      mouseStatus.classList.add("hidden");
      itemsLayer.innerHTML = "";
    }

    function resetTunnelState() {
      state.mouse.tunnelCooldown = 1.2;
      state.mouse.protectionTimer = 0;
      state.mouse.tunneling = false;
      state.mouse.tunnelTimer = 0;
      state.mouse.tunnelDuration = 0;
      state.mouse.tunnelFrom = null;
      state.mouse.tunnelTo = null;
      state.mouse.tunnelScale = 1;
      state.mouse.tunnelOpacity = 1;
      mouseEl.classList.remove("tunneling", "protected");
      mouseEl.style.opacity = "";
    }

    function measureRoom() {
      state.roomWidth = Math.max(1, room.clientWidth);
      state.roomHeight = Math.max(1, room.clientHeight);
    }

    function createObstacles() {
      const count = state.config.obstacleCount ?? 3;
      const scale = clamp(Math.min(state.roomWidth / 360, state.roomHeight / 560), 0.72, 1);
      const sofaW = clamp(state.roomWidth * 0.38, 108, 164);
      const sofaH = 44 * scale;
      const tableW = 76 * scale;
      const tableH = 62 * scale;
      const cabinetW = 64 * scale;
      const cabinetH = 86 * scale;
      const allObstacles = [
        makeObstacle("sofa", state.roomWidth * 0.50, state.roomHeight * 0.28, sofaW, sofaH),
        makeObstacle("table", state.roomWidth * 0.73, state.roomHeight * 0.57, tableW, tableH),
        makeObstacle("cabinet", state.roomWidth * 0.31, state.roomHeight * 0.68, cabinetW, cabinetH),
        makeObstacle("table", state.roomWidth * 0.56, state.roomHeight * 0.82, tableW * 0.82, tableH * 0.8)
      ];
      state.obstacles = allObstacles.slice(0, count);
      renderObstacles();
    }

    function makeObstacle(type, centerX, centerY, width, height) {
      const pad = 12;
      const w = Math.min(width, state.roomWidth - pad * 2);
      const h = Math.min(height, state.roomHeight - pad * 2);
      return {
        type,
        x: clamp(centerX - w / 2, pad, state.roomWidth - w - pad),
        y: clamp(centerY - h / 2, pad, state.roomHeight - h - pad),
        w,
        h
      };
    }

    function renderObstacles() {
      obstaclesLayer.innerHTML = "";
      state.obstacles.forEach(obstacle => {
        const el = document.createElement("div");
        el.className = `obstacle obstacle-${obstacle.type}`;
        el.style.left = `${obstacle.x}px`;
        el.style.top = `${obstacle.y}px`;
        el.style.width = `${obstacle.w}px`;
        el.style.height = `${obstacle.h}px`;
        obstaclesLayer.appendChild(el);
      });
    }

    function loadLevelProgress() {
      const saved = JSON.parse(localStorage.getItem("guguLevelProgress") || "null");
      state.levelProgress = saved || {
        highestUnlockedLevel: 1,
        bestLevelReached: 1,
        bestTotalScore: 0,
        levelBest: {}
      };
      state.levelProgress.levelBest = state.levelProgress.levelBest || {};
      state.levelProgress.highestUnlockedLevel = clamp(state.levelProgress.highestUnlockedLevel || 1, 1, levels.length);
      updateLevelProgressCard();
      return state.levelProgress;
    }

    function saveLevelProgress() {
      localStorage.setItem("guguLevelProgress", JSON.stringify(state.levelProgress));
      updateLevelProgressCard();
    }

    function getTotalStars() {
      if (!state.levelProgress) return 0;
      return levels.reduce((sum, level) => {
        const best = state.levelProgress.levelBest[level.id];
        return sum + (best ? best.stars || 0 : 0);
      }, 0);
    }

    function getLevelStars() {
      const ratio = state.timeLeft / state.config.time;
      if (ratio >= 0.5) return 3;
      if (ratio >= 0.25) return 2;
      return state.timeLeft > 0 ? 1 : 0;
    }

    function formatStars(stars) {
      return "★".repeat(stars) + "☆".repeat(3 - stars);
    }

    function updateLevelProgressCard() {
      if (!state.levelProgress) return;
      levelProgressCard.textContent = `当前最高解锁关卡：第 ${state.levelProgress.highestUnlockedLevel} 关｜总星级：${getTotalStars()} / ${levels.length * 3}｜最佳总分：${state.levelProgress.bestTotalScore || 0}`;
    }

    function renderLevelList() {
      loadLevelProgress();
      levelList.innerHTML = "";
      levels.forEach((level, index) => {
        const unlocked = level.id <= state.levelProgress.highestUnlockedLevel;
        const best = state.levelProgress.levelBest[level.id];
        const button = document.createElement("button");
        button.className = `level-card ${unlocked ? "" : "locked"}`;
        button.disabled = !unlocked;
        button.innerHTML = unlocked ? `
          <strong>第 ${level.id} 关：${level.name}</strong>
          <span class="stars">${formatStars(best ? best.stars || 0 : 0)}</span>
          <span>${best ? "已通关" : "已解锁"}｜最佳分数：${best ? best.score : "暂无"}｜最快时间：${best ? best.fastest.toFixed(1) + "s" : "暂无"}</span>
        ` : `
          <strong>第 ${level.id} 关：${level.name}</strong>
          <span>🔒 未解锁</span>
        `;
        button.addEventListener("click", () => {
          if (!unlocked) return;
          userFeedback("start");
          startLevelGame(index, index === 0);
        });
        levelList.appendChild(button);
      });
    }

    function createTunnels() {
      if (!state.config.tunnelsEnabled) {
        state.tunnels = [];
        tunnelsLayer.innerHTML = "";
        return;
      }
      const radius = clamp(Math.min(state.roomWidth, state.roomHeight) * 0.07, 22, 28);
      state.tunnels = [
        makeTunnel("a", state.roomWidth * 0.18, state.roomHeight * 0.22, radius),
        makeTunnel("b", state.roomWidth * 0.82, state.roomHeight * 0.78, radius)
      ];
      renderTunnels();
    }

    function makeTunnel(id, preferredX, preferredY, radius) {
      const margin = radius + 18;
      const candidates = [{ x: preferredX, y: preferredY }];
      for (let ring = 1; ring <= 4; ring += 1) {
        const spread = ring * 22;
        for (let i = 0; i < 8; i += 1) {
          const angle = i / 8 * Math.PI * 2;
          candidates.push({ x: preferredX + Math.cos(angle) * spread, y: preferredY + Math.sin(angle) * spread });
        }
      }
      const point = candidates.find(candidate => isTunnelPositionSafe(candidate.x, candidate.y, radius)) || { x: preferredX, y: preferredY };
      return {
        id,
        x: clamp(point.x, margin, state.roomWidth - margin),
        y: clamp(point.y, margin, state.roomHeight - margin),
        radius
      };
    }

    function isTunnelPositionSafe(x, y, radius) {
      const margin = radius + 14;
      if (x < margin || y < margin || x > state.roomWidth - margin || y > state.roomHeight - margin) return false;
      return !state.obstacles.some(rect => circleRectCollision({ x, y, radius: radius + 8 }, rect));
    }

    function renderTunnels() {
      tunnelsLayer.innerHTML = "";
      state.tunnels.forEach(tunnel => {
        const el = document.createElement("div");
        el.className = `tunnel tunnel-${tunnel.id}`;
        const width = tunnel.radius * 2;
        el.style.left = `${tunnel.x}px`;
        el.style.top = `${tunnel.y}px`;
        el.style.width = `${width}px`;
        el.style.height = `${Math.round(width * 0.78)}px`;
        tunnelsLayer.appendChild(el);
      });
    }

    function renderItems() {
      itemsLayer.innerHTML = "";
      if (state.items.speedShoe.active) {
        itemsLayer.appendChild(createItemElement("speedShoe", "item-speed-shoe", "👟"));
      }
      if (state.items.cheese.active) {
        itemsLayer.appendChild(createItemElement("cheese", "item-cheese", "🧀⚡"));
      }
    }

    function createItemElement(type, className, text) {
      const item = state.items[type];
      const el = document.createElement("div");
      el.className = `item ${className}`;
      el.textContent = text;
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      return el;
    }

    function getRandomSafeItemPosition(radius, options = {}) {
      for (let i = 0; i < 80; i += 1) {
        const x = randomRange(radius + 20, state.roomWidth - radius - 20);
        const y = randomRange(radius + 20, state.roomHeight - radius - 20);
        if (isItemPositionSafe(x, y, radius, options.type)) return { x, y };
      }
      const fallback = [
        { x: state.roomWidth * 0.5, y: state.roomHeight * 0.18 },
        { x: state.roomWidth * 0.18, y: state.roomHeight * 0.5 },
        { x: state.roomWidth * 0.82, y: state.roomHeight * 0.5 },
        { x: state.roomWidth * 0.5, y: state.roomHeight * 0.82 }
      ].find(point => isItemPositionSafe(point.x, point.y, radius, options.type));
      return fallback || { x: state.roomWidth / 2, y: state.roomHeight / 2 };
    }

    function isItemPositionSafe(x, y, radius, type) {
      if (isPositionBlocked(x, y, radius)) return false;
      if (state.tunnels.some(tunnel => distance({ x, y }, tunnel) < tunnel.radius + radius + 10)) return false;
      if (distance({ x, y }, centerOf(state.cat)) < (type === "speedShoe" ? 90 : 70)) return false;
      if (distance({ x, y }, centerOf(state.mouse)) < (type === "cheese" ? 90 : 60)) return false;
      return true;
    }

    function validateItemsAfterResize() {
      [["speedShoe", 18], ["cheese", 19]].forEach(([type, radius]) => {
        const item = state.items[type];
        if (!item.active) return;
        if (!isItemPositionSafe(item.x, item.y, radius, type)) {
          const point = getRandomSafeItemPosition(radius, { type });
          item.x = point.x;
          item.y = point.y;
        }
      });
      renderItems();
    }

    function randomizeMousePosition() {
      const spawn = getSafeSpawnPosition(state.mouse.size / 2, "mouse");
      state.mouse.x = spawn.x;
      state.mouse.y = spawn.y;
    }

    function restartGame() {
      resetJoystick();
      if (state.gameMode === "level") startLevelGame(state.currentLevelIndex, state.campaignRun);
      else startChallengeGame();
    }

    function returnToMenu() {
      stopLoop();
      clearOpeningCountdown();
      clearTimeout(state.endTimer);
      resetJoystick();
      resetCatDash();
      resetTunnelState();
      resetItems();
      particleLayer.innerHTML = "";
      mouseEl.style.animationPlayState = "running";
      loadLevelProgress();
      showScreen("menu");
      loadBestScore();
    }

    function pauseGame() {
      if (!state.running || state.finished || state.paused) return;
      state.paused = true;
      state.running = false;
      state.gameState = "paused";
      cancelAnimationFrame(state.rafId);
      updateDashButton();
      showScreen("pause");
    }

    function resumeGame() {
      if (state.finished) return;
      showScreen("game");
        measureRoom();
        createObstacles();
        createTunnels();
        if (state.mouse.tunneling) resetTunnelState();
        moveEntityToNearestSafe(state.cat, "cat");
      moveEntityToNearestSafe(state.mouse, "mouse");
      state.paused = false;
      state.running = true;
      state.gameState = "playing";
      state.lastTime = performance.now();
      cancelAnimationFrame(state.rafId);
      state.rafId = requestAnimationFrame(gameLoop);
      updateDashButton();
    }

    function stopLoop() {
      state.running = false;
      state.paused = false;
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
      updateDashButton();
    }

    function gameLoop(now) {
      if (!state.running || state.paused || state.finished) return;
      const dt = Math.min(0.033, (now - state.lastTime) / 1000);
      state.lastTime = now;
      update(dt);
      render();
      state.rafId = requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      state.elapsed += dt;
      state.timeLeft = Math.max(0, state.config.time - state.elapsed);
      updateCatDash(dt);
      updateItems(dt);
      updateCat(dt);
      updateMouse(dt);
      checkCountdownBeep();
      checkCatch();
      if (!state.finished && state.timeLeft <= 0) {
        finishGame(false);
      }
    }

    function updateCatDash(dt) {
      if (state.cat.speedBoostTimer > 0) {
        state.cat.speedBoostTimer = Math.max(0, state.cat.speedBoostTimer - dt);
      }
      if (state.cat.isDashing) {
        state.cat.dashTimer = Math.max(0, state.cat.dashTimer - dt);
        if (state.cat.dashTimer <= 0) {
          state.cat.isDashing = false;
          catEl.classList.remove("dashing");
        }
      }
      if (state.cat.dashCooldownTimer > 0) {
        state.cat.dashCooldownTimer = Math.max(0, state.cat.dashCooldownTimer - dt);
      }
      state.cat.dashReady = state.cat.dashCooldownTimer <= 0 && !state.cat.isDashing;
    }

    function updateItems(dt) {
      if (!state.config.itemsEnabled) return;
      if (state.cat.speedBoostTimer <= 0) catEl.classList.remove("speed-boosted");
      if (state.mouse.cheeseBoostTimer > 0) {
        state.mouse.cheeseBoostTimer = Math.max(0, state.mouse.cheeseBoostTimer - dt);
      }
      if (state.mouse.recentlyAteCheeseTimer > 0) {
        state.mouse.recentlyAteCheeseTimer = Math.max(0, state.mouse.recentlyAteCheeseTimer - dt);
      }
      if (state.mouse.cheeseBoostTimer <= 0) mouseEl.classList.remove("cheese-boosted");

      updateItemSpawnTimer("speedShoe", dt);
      updateItemSpawnTimer("cheese", dt);
      checkItemPickups();
      renderItems();
    }

    function updateItemSpawnTimer(type, dt) {
      const item = state.items[type];
      if (item.active || state.timeLeft <= 5) return;
      if (type === "speedShoe" && !state.config.speedShoeEnabled) return;
      if (type === "cheese" && (!state.config.cheeseEnabled || state.mouse.cheeseBoostTimer > 0 || state.mouse.recentlyAteCheeseTimer > 0)) return;
      item.spawnTimer = Math.max(0, item.spawnTimer - dt);
      if (item.spawnTimer <= 0) spawnItem(type);
    }

    function spawnItem(type) {
      const radius = type === "speedShoe" ? 18 : 19;
      const point = getRandomSafeItemPosition(radius, { type });
      const item = state.items[type];
      item.active = true;
      item.x = point.x;
      item.y = point.y;
    }

    function checkItemPickups() {
      const shoe = state.items.speedShoe;
      if (shoe.active && distance(centerOf(state.cat), shoe) < 32) {
        shoe.active = false;
        state.cat.speedBoostTimer = 3;
        shoe.spawnTimer = state.timeLeft > 5 ? randomRange(8, 12) : Infinity;
        catEl.classList.add("speed-boosted");
        playSound("speedShoe");
        vibrate(25);
      }

      const cheese = state.items.cheese;
      if (cheese.active && !state.mouse.tunneling && distance(centerOf(state.mouse), cheese) < 32) {
        cheese.active = false;
        state.mouse.cheeseBoostTimer = 2.5;
        state.mouse.recentlyAteCheeseTimer = 8;
        cheese.spawnTimer = state.timeLeft > 5 ? randomRange(10, 14) : Infinity;
        mouseEl.classList.add("cheese-boosted");
        playSound("cheeseBoost");
        vibrate(35);
      } else if (cheese.active && distance(centerOf(state.cat), cheese) < 32) {
        cheese.active = false;
        cheese.spawnTimer = state.timeLeft > 5 ? randomRange(10, 14) : Infinity;
        playSound("cheeseBreak");
        vibrate(20);
      }
    }

    function triggerCatDash() {
      ensureAudio();
      if (!state.config.catDashEnabled) return;
      if (state.countdownActive || state.gameState !== "playing" || !state.running || state.paused || state.finished || state.cat.isDashing || state.cat.dashCooldownTimer > 0) return;
      if (state.input.power <= 0.2) {
        showDashHint();
        vibrate(15);
        return;
      }
      state.cat.isDashing = true;
      state.cat.dashTimer = state.config.catDashDuration;
      state.cat.dashCooldownTimer = state.config.catDashCooldown;
      state.cat.dashReady = false;
      state.cat.lastMoveDirX = state.input.x;
      state.cat.lastMoveDirY = state.input.y;
      catEl.classList.add("dashing");
      playSound("dash");
      vibrate(30);
      updateDashButton();
    }

    function showDashHint() {
      dashBtn.classList.remove("hint");
      void dashBtn.offsetWidth;
      dashBtn.classList.add("hint");
    }

    function updateCat(dt) {
      const input = state.input;
      if (input.power > 0.05) {
        state.cat.lastMoveDirX = input.x;
        state.cat.lastMoveDirY = input.y;
      }
      const dashMult = state.cat.isDashing ? state.config.catDashMultiplier : 1;
      const shoeMult = state.cat.speedBoostTimer > 0 ? 1.25 : 1;
      const maxSpeed = state.config.catSpeed * Math.min(2.1, dashMult * shoeMult);
      const targetVx = input.x * maxSpeed;
      const targetVy = input.y * maxSpeed;
      const accelStep = state.cat.acceleration * (state.cat.isDashing ? 1.45 : 1) * dt;

      if (input.power > 0.02) {
        state.cat.vx = approach(state.cat.vx, targetVx, accelStep);
        state.cat.vy = approach(state.cat.vy, targetVy, accelStep);
      } else {
        const decay = Math.max(0, 1 - state.cat.friction * dt);
        state.cat.vx *= decay;
        state.cat.vy *= decay;
        if (Math.abs(state.cat.vx) < 2) state.cat.vx = 0;
        if (Math.abs(state.cat.vy) < 2) state.cat.vy = 0;
      }

      const currentSpeed = Math.hypot(state.cat.vx, state.cat.vy);
      if (currentSpeed > maxSpeed) {
        state.cat.vx = state.cat.vx / currentSpeed * maxSpeed;
        state.cat.vy = state.cat.vy / currentSpeed * maxSpeed;
      }

      const moveResult = moveEntityWithObstacleCollision(
        state.cat,
        state.cat.x + state.cat.vx * dt,
        state.cat.y + state.cat.vy * dt
      );
      if (moveResult.blockedX) state.cat.vx = 0;
      if (moveResult.blockedY) state.cat.vy = 0;
      if (Math.abs(state.cat.vx) > 5) state.cat.facing = state.cat.vx >= 0 ? 1 : -1;
      if (Math.hypot(state.cat.vx, state.cat.vy) > 8) {
        state.cat.angle = Math.atan2(state.cat.vy, Math.abs(state.cat.vx)) * 0.22;
      } else {
        state.cat.angle = 0;
      }
    }

    function updateMouse(dt) {
      const catCenter = centerOf(state.cat);
      const mouseCenter = centerOf(state.mouse);
      const dist = distance(catCenter, mouseCenter);
      const predictedCat = getPredictedCatPosition();
      const threatPoint = state.mouse.dangerMeter > 0.25 ? predictedCat : catCenter;
      const threatDist = distance(mouseCenter, threatPoint);
      let dirX = state.mouse.dirX;
      let dirY = state.mouse.dirY;

      state.mouse.tunnelCooldown = Math.max(0, state.mouse.tunnelCooldown - dt);
      state.mouse.protectionTimer = Math.max(0, state.mouse.protectionTimer - dt);
      if (state.mouse.tunneling) {
        updateMouseTunnel(dt);
        mouseEl.classList.toggle("protected", state.mouse.protectionTimer > 0);
        return;
      }

      state.mouse.sprintCooldown = Math.max(0, state.mouse.sprintCooldown - dt);
      state.mouse.sprintTimer = Math.max(0, state.mouse.sprintTimer - dt);
      state.mouse.sprinting = state.mouse.sprintTimer > 0;
      state.mouse.dodgeCooldown = Math.max(0, state.mouse.dodgeCooldown - dt);
      state.mouse.dodgeTimer = Math.max(0, state.mouse.dodgeTimer - dt);
      updateDangerMeter(dt, dist);
      if (tryUseTunnel(dt, dist)) {
        mouseEl.classList.toggle("protected", state.mouse.protectionTimer > 0);
        return;
      }

      if (dist < state.config.alertDistance) {
        const awayX = (mouseCenter.x - threatPoint.x) / (threatDist || 1);
        const awayY = (mouseCenter.y - threatPoint.y) / (threatDist || 1);
        if (!state.mouse.sprinting && state.mouse.sprintCooldown <= 0 && Math.random() < sprintChance(dt)) {
          startMouseSprint(awayX, awayY);
        }
        if (state.config.mouseDodgeEnabled && state.mouse.dodgeTimer <= 0 && state.mouse.dodgeCooldown <= 0 && dist < state.config.alertDistance * 0.65 && Math.random() < dodgeChance(dt)) {
          startMouseDodge(awayX, awayY, threatPoint);
        }
        const wobbleRange = state.mouse.sprinting ? 0.28 : 0.48 + state.mouse.dangerMeter * 0.38;
        const wobble = (Math.random() - 0.5) * wobbleRange;
        const cos = Math.cos(wobble);
        const sin = Math.sin(wobble);
        if (state.mouse.dodgeTimer > 0) {
          dirX = awayX * 0.45 + state.mouse.dodgeX * 0.95;
          dirY = awayY * 0.45 + state.mouse.dodgeY * 0.95;
        } else if (!state.mouse.sprinting) {
          dirX = awayX * cos - awayY * sin;
          dirY = awayX * sin + awayY * cos;
        }
      } else {
        state.mouse.wanderTimer -= dt;
        if (state.mouse.wanderTimer <= 0) {
          setWanderDirection();
        }
        dirX = state.mouse.dirX;
        dirY = state.mouse.dirY;
      }
      const cheesePull = getCheeseAttraction(dist);
      if (cheesePull) {
        dirX = dirX * (1 - cheesePull.weight) + cheesePull.x * cheesePull.weight;
        dirY = dirY * (1 - cheesePull.weight) + cheesePull.y * cheesePull.weight;
      }

      const wallPad = 42;
      const mouseRadius = state.mouse.size / 2;
      if (state.mouse.x < mouseRadius + wallPad) dirX += 1.2;
      if (state.mouse.y < mouseRadius + wallPad) dirY += 1.2;
      if (state.mouse.x > state.roomWidth - mouseRadius - wallPad) dirX -= 1.2;
      if (state.mouse.y > state.roomHeight - mouseRadius - wallPad) dirY -= 1.2;
      const avoid = obstacleAvoidanceVector(state.mouse);
      dirX += avoid.x;
      dirY += avoid.y;
      const smarter = chooseObstacleAwareDirection(dirX, dirY, threatPoint);
      dirX = smarter.x;
      dirY = smarter.y;

      const len = Math.hypot(dirX, dirY) || 1;
      state.mouse.dirX = dirX / len;
      state.mouse.dirY = dirY / len;
      let speedFactor = state.mouse.sprinting ? state.config.sprintMultiplier : (state.mouse.sprintCooldown > 0 ? 0.9 : 1);
      if (state.mouse.dodgeTimer > 0) speedFactor = Math.max(speedFactor, 1.25);
      if (state.mouse.cheeseBoostTimer > 0) speedFactor *= 1.3;
      speedFactor = Math.min(speedFactor, 2.0);
      state.mouse.vx = state.mouse.dirX * state.config.mouseSpeed * speedFactor;
      state.mouse.vy = state.mouse.dirY * state.config.mouseSpeed * speedFactor;
      const beforeX = state.mouse.x;
      const beforeY = state.mouse.y;
      const moveResult = moveEntityWithObstacleCollision(
        state.mouse,
        state.mouse.x + state.mouse.vx * dt,
        state.mouse.y + state.mouse.vy * dt
      );

      if (moveResult.blockedX || moveResult.blockedY) {
        state.mouse.blockedCount += 1;
        if (moveResult.blockedX) state.mouse.dirX *= -0.6;
        if (moveResult.blockedY) state.mouse.dirY *= -0.6;
        if (state.mouse.blockedCount >= 3) {
          chooseMouseEscapeDirection();
        }
      } else {
        state.mouse.blockedCount = Math.max(0, state.mouse.blockedCount - 1);
      }
      updateMouseStuckState(dt, beforeX, beforeY);
      mouseEl.classList.toggle("sprinting", state.mouse.sprinting);
      mouseEl.classList.toggle("protected", state.mouse.protectionTimer > 0);
    }

    function setWanderDirection() {
      const angle = Math.random() * Math.PI * 2;
      state.mouse.dirX = Math.cos(angle);
      state.mouse.dirY = Math.sin(angle);
      state.mouse.wanderTimer = 0.8 + Math.random() * 0.8;
    }

    function startMouseSprint(awayX, awayY) {
      let baseX = awayX;
      let baseY = awayY;
      if (state.mouse.dodgeTimer > 0) {
        baseX = awayX * 0.65 + state.mouse.dodgeX * 0.6;
        baseY = awayY * 0.65 + state.mouse.dodgeY * 0.6;
      }
      const angle = Math.atan2(baseY, baseX) + (Math.random() - 0.5) * (0.45 + state.mouse.dangerMeter * 0.28);
      const safeDir = chooseObstacleAwareDirection(Math.cos(angle), Math.sin(angle), getPredictedCatPosition());
      state.mouse.dirX = safeDir.x;
      state.mouse.dirY = safeDir.y;
      state.mouse.sprintTimer = state.config.sprintDuration;
      state.mouse.sprintCooldown = state.config.sprintDuration + state.config.sprintCooldown;
      state.mouse.sprinting = true;
    }

    function getPredictedCatPosition() {
      const speed = Math.hypot(state.cat.vx, state.cat.vy);
      if (speed < 12) return centerOf(state.cat);
      return {
        x: clamp(state.cat.x + state.cat.vx * state.config.predictionTime, state.cat.size / 2, state.roomWidth - state.cat.size / 2),
        y: clamp(state.cat.y + state.cat.vy * state.config.predictionTime, state.cat.size / 2, state.roomHeight - state.cat.size / 2)
      };
    }

    function updateDangerMeter(dt, dist) {
      if (dist < state.config.alertDistance) {
        const closeness = 1 - clamp(dist / state.config.alertDistance, 0, 1);
        state.mouse.dangerMeter = clamp(state.mouse.dangerMeter + dt * (0.45 + closeness * 1.55), 0, 1);
      } else {
        state.mouse.dangerMeter = clamp(state.mouse.dangerMeter - dt * 0.55, 0, 1);
      }
    }

    function sprintChance(dt) {
      return dt * (1.6 + state.mouse.dangerMeter * 4.8);
    }

    function dodgeChance(dt) {
      const boost = state.mouse.cheeseBoostTimer > 0 ? 1.35 : 1;
      return dt * (0.9 + state.mouse.dangerMeter * 3.4) * boost;
    }

    function startMouseDodge(awayX, awayY, threatPoint) {
      const left = normalizeVector(-awayY, awayX);
      const right = normalizeVector(awayY, -awayX);
      const leftScore = scoreEscapeDirection(left.x, left.y, threatPoint);
      const rightScore = scoreEscapeDirection(right.x, right.y, threatPoint);
      const chosen = leftScore >= rightScore ? left : right;
      if (Math.max(leftScore, rightScore) < -999) return;
      state.mouse.dodgeX = chosen.x;
      state.mouse.dodgeY = chosen.y;
      state.mouse.dodgeTimer = 0.3 + Math.random() * 0.2;
      state.mouse.dodgeCooldown = state.mouse.dodgeTimer + 1.5 + Math.random() * 0.7;
    }

    function tryUseTunnel(dt, catDistance) {
      if (!state.config.tunnelsEnabled) return false;
      if (state.mouse.tunnelCooldown > 0 || state.mouse.protectionTimer > 0 || state.tunnels.length < 2) return false;
      if (catDistance >= state.config.alertDistance * state.config.tunnelTriggerRatio) return false;
      if (state.mouse.dangerMeter < state.config.tunnelDangerMin) return false;
      const nearest = getNearestTunnel();
      if (!nearest || nearest.distance > 60) return false;
      const cheeseBoost = state.mouse.cheeseBoostTimer > 0 ? 1.25 : 1;
      if (Math.random() > state.config.tunnelChance * cheeseBoost * dt) return false;
      enterTunnel(nearest.tunnel);
      return true;
    }

    function getCheeseAttraction(catDistance) {
      const cheese = state.items.cheese;
      if (!state.config.cheeseEnabled || !cheese.active || state.mouse.cheeseBoostTimer > 0 || state.mouse.tunneling) return null;
      const cheeseDistance = distance(centerOf(state.mouse), cheese);
      if (cheeseDistance > 150) return null;
      if (catDistance < state.config.alertDistance * 0.6) return null;
      const awareness = state.config.mouseCheeseAwareness || 0;
      if (awareness <= 0 || Math.random() > awareness * 0.08) return null;
      const dir = normalizeVector(cheese.x - state.mouse.x, cheese.y - state.mouse.y);
      return { x: dir.x, y: dir.y, weight: catDistance > state.config.alertDistance ? 0.45 : 0.28 };
    }

    function getNearestTunnel() {
      let best = null;
      state.tunnels.forEach(tunnel => {
        const d = distance(centerOf(state.mouse), tunnel);
        if (!best || d < best.distance) best = { tunnel, distance: d };
      });
      return best;
    }

    function enterTunnel(tunnel) {
      const target = state.tunnels.find(item => item.id !== tunnel.id);
      if (!target) return;
      const exit = getSafeTunnelExit(target);
      state.mouse.tunneling = true;
      state.mouse.tunnelTimer = 0;
      state.mouse.tunnelDuration = 0.35 + Math.random() * 0.2;
      state.mouse.tunnelFrom = tunnel;
      state.mouse.tunnelTo = target;
      state.mouse.tunnelStartX = state.mouse.x;
      state.mouse.tunnelStartY = state.mouse.y;
      state.mouse.tunnelExitX = exit.x;
      state.mouse.tunnelExitY = exit.y;
      state.mouse.vx = 0;
      state.mouse.vy = 0;
      state.mouse.sprintTimer = 0;
      state.mouse.dodgeTimer = 0;
      state.mouse.sprinting = false;
      mouseEl.classList.add("tunneling");
      mouseEl.classList.remove("sprinting");
    }

    function updateMouseTunnel(dt) {
      state.mouse.tunnelTimer += dt;
      const progress = clamp(state.mouse.tunnelTimer / state.mouse.tunnelDuration, 0, 1);
      const from = state.mouse.tunnelFrom;
      const to = state.mouse.tunnelTo;
      if (progress < 0.5) {
        const t = easeInOut(progress / 0.5);
        state.mouse.x = lerp(state.mouse.tunnelStartX, from.x, t);
        state.mouse.y = lerp(state.mouse.tunnelStartY, from.y, t);
        state.mouse.tunnelScale = lerp(1, 0.2, t);
        state.mouse.tunnelOpacity = lerp(1, 0.12, t);
      } else {
        const t = easeInOut((progress - 0.5) / 0.5);
        state.mouse.x = lerp(to.x, state.mouse.tunnelExitX, t);
        state.mouse.y = lerp(to.y, state.mouse.tunnelExitY, t);
        state.mouse.tunnelScale = lerp(0.2, 1, t);
        state.mouse.tunnelOpacity = lerp(0.12, 1, t);
      }

      if (progress >= 1) {
        exitTunnel();
      }
    }

    function exitTunnel() {
      state.mouse.tunneling = false;
      state.mouse.x = state.mouse.tunnelExitX;
      state.mouse.y = state.mouse.tunnelExitY;
      state.mouse.tunnelScale = 1;
      state.mouse.tunnelOpacity = 1;
      state.mouse.tunnelCooldown = state.config.tunnelCooldown;
      state.mouse.protectionTimer = state.config.tunnelProtection;
      const away = normalizeVector(state.mouse.x - state.cat.x, state.mouse.y - state.cat.y);
      state.mouse.dirX = away.x;
      state.mouse.dirY = away.y;
      state.mouse.wanderTimer = 0.35;
      state.mouse.blockedCount = 0;
      state.mouse.stuckTimer = 0;
      mouseEl.classList.remove("tunneling");
      mouseEl.classList.add("protected");
    }

    function getSafeTunnelExit(tunnel) {
      const radius = state.mouse.size / 2;
      const cat = centerOf(state.cat);
      const preferredAway = normalizeVector(tunnel.x - cat.x, tunnel.y - cat.y);
      const candidates = [{ x: tunnel.x + preferredAway.x * 58, y: tunnel.y + preferredAway.y * 58 }];
      for (let r = 40; r <= 82; r += 14) {
        for (let i = 0; i < 12; i += 1) {
          const angle = i / 12 * Math.PI * 2;
          candidates.push({ x: tunnel.x + Math.cos(angle) * r, y: tunnel.y + Math.sin(angle) * r });
        }
      }
      const safe = candidates
        .map(point => ({ x: clamp(point.x, radius, state.roomWidth - radius), y: clamp(point.y, radius, state.roomHeight - radius) }))
        .filter(point => !isPositionBlocked(point.x, point.y, radius))
        .sort((a, b) => distance(b, cat) - distance(a, cat))[0];
      return safe || { x: tunnel.x, y: tunnel.y };
    }

    function bounceMouseFromWall(hitWall) {
      if (hitWall.x) state.mouse.dirX *= -1;
      if (hitWall.y) state.mouse.dirY *= -1;
      const angle = Math.atan2(state.mouse.dirY, state.mouse.dirX) + (Math.random() - 0.5) * 0.8;
      state.mouse.dirX = Math.cos(angle);
      state.mouse.dirY = Math.sin(angle);
      state.mouse.wanderTimer = 0.45 + Math.random() * 0.35;
    }

    function getSafeSpawnPosition(radius, preferredArea) {
      const fallback = preferredArea === "cat"
        ? { x: state.roomWidth * 0.18, y: state.roomHeight * 0.78 }
        : { x: state.roomWidth * 0.82, y: state.roomHeight * 0.22 };
      const minMouseDistance = Math.min(220, Math.max(160, Math.hypot(state.roomWidth, state.roomHeight) * 0.48));

      for (let i = 0; i < 80; i += 1) {
        let x;
        let y;
        if (preferredArea === "cat") {
          x = state.roomWidth * (0.12 + Math.random() * 0.22);
          y = state.roomHeight * (0.66 + Math.random() * 0.22);
        } else {
          x = state.roomWidth * (0.58 + Math.random() * 0.30);
          y = state.roomHeight * (0.12 + Math.random() * 0.36);
          if (i > 35) y = state.roomHeight * (0.12 + Math.random() * 0.72);
        }
        if (preferredArea === "mouse" && distance({ x, y }, centerOf(state.cat)) < minMouseDistance) continue;
        if (!isPositionBlocked(x, y, radius)) return { x, y };
      }

      const safePoints = [
        fallback,
        { x: state.roomWidth * 0.18, y: state.roomHeight * 0.82 },
        { x: state.roomWidth * 0.84, y: state.roomHeight * 0.18 },
        { x: state.roomWidth * 0.82, y: state.roomHeight * 0.76 },
        { x: state.roomWidth * 0.50, y: state.roomHeight * 0.50 }
      ];
      const safePoint = safePoints
        .filter(point => !isPositionBlocked(point.x, point.y, radius))
        .sort((a, b) => distance(b, centerOf(state.cat)) - distance(a, centerOf(state.cat)))[0];
      return safePoint || {
        x: clamp(fallback.x, radius, state.roomWidth - radius),
        y: clamp(fallback.y, radius, state.roomHeight - radius)
      };
    }

    function circleRectCollision(circle, rect) {
      const closestX = clamp(circle.x, rect.x, rect.x + rect.w);
      const closestY = clamp(circle.y, rect.y, rect.y + rect.h);
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return dx * dx + dy * dy < circle.radius * circle.radius;
    }

    function resolveCircleRectCollision(entity, rect) {
      const radius = entity.size / 2;
      if (!circleRectCollision({ x: entity.x, y: entity.y, radius }, rect)) return false;

      const closestX = clamp(entity.x, rect.x, rect.x + rect.w);
      const closestY = clamp(entity.y, rect.y, rect.y + rect.h);
      let dx = entity.x - closestX;
      let dy = entity.y - closestY;
      let dist = Math.hypot(dx, dy);

      if (dist === 0) {
        const left = Math.abs(entity.x - rect.x);
        const right = Math.abs(rect.x + rect.w - entity.x);
        const top = Math.abs(entity.y - rect.y);
        const bottom = Math.abs(rect.y + rect.h - entity.y);
        const min = Math.min(left, right, top, bottom);
        if (min === left) { dx = -1; dy = 0; dist = 1; }
        else if (min === right) { dx = 1; dy = 0; dist = 1; }
        else if (min === top) { dx = 0; dy = -1; dist = 1; }
        else { dx = 0; dy = 1; dist = 1; }
      }

      const push = radius - dist + 0.5;
      entity.x += dx / dist * push;
      entity.y += dy / dist * push;
      clampToRoom(entity);
      return true;
    }

    function collidesWithAnyObstacle(entity) {
      const radius = entity.size / 2;
      return state.obstacles.some(rect => circleRectCollision({ x: entity.x, y: entity.y, radius }, rect));
    }

    function moveEntityToNearestSafe(entity, preferredArea) {
      clampToRoom(entity);
      for (let i = 0; i < 4; i += 1) {
        let resolved = false;
        state.obstacles.forEach(rect => {
          if (resolveCircleRectCollision(entity, rect)) resolved = true;
        });
        clampToRoom(entity);
        if (!resolved && !collidesWithAnyObstacle(entity)) return;
      }
      if (collidesWithAnyObstacle(entity) || isPositionBlocked(entity.x, entity.y, entity.size / 2)) {
        const safe = getSafeSpawnPosition(entity.size / 2, preferredArea);
        entity.x = safe.x;
        entity.y = safe.y;
        entity.vx = 0;
        entity.vy = 0;
      }
    }

    function isPositionBlocked(x, y, radius) {
      if (x < radius || y < radius || x > state.roomWidth - radius || y > state.roomHeight - radius) return true;
      return state.obstacles.some(rect => circleRectCollision({ x, y, radius }, rect));
    }

    function moveEntityWithObstacleCollision(entity, nextX, nextY) {
      const radius = entity.size / 2;
      const startX = entity.x;
      const startY = entity.y;
      const blockedX = isPositionBlocked(nextX, startY, radius);
      if (!blockedX) entity.x = nextX;
      const blockedY = isPositionBlocked(entity.x, nextY, radius);
      if (!blockedY) entity.y = nextY;
      clampToRoom(entity);
      return { blockedX, blockedY, moved: entity.x !== startX || entity.y !== startY };
    }

    function obstacleAvoidanceVector(entity) {
      const radius = entity.size / 2;
      const lookX = entity.x + entity.dirX * (radius + 22);
      const lookY = entity.y + entity.dirY * (radius + 22);
      const obstacle = state.obstacles.find(rect => circleRectCollision({ x: lookX, y: lookY, radius }, rect));
      if (!obstacle) return { x: 0, y: 0 };
      const centerX = obstacle.x + obstacle.w / 2;
      const centerY = obstacle.y + obstacle.h / 2;
      const dx = entity.x - centerX;
      const dy = entity.y - centerY;
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len * 0.9, y: dy / len * 0.9 };
    }

    function chooseObstacleAwareDirection(dirX, dirY, threatPoint) {
      const base = normalizeVector(dirX, dirY);
      if (!willDirectionHitObstacle(base.x, base.y)) return base;

      const candidates = [
        rotateVector(base.x, base.y, Math.PI / 4),
        rotateVector(base.x, base.y, -Math.PI / 4),
        rotateVector(base.x, base.y, Math.PI / 2),
        rotateVector(base.x, base.y, -Math.PI / 2)
      ];
      let best = null;
      let bestScore = -Infinity;
      candidates.forEach(candidate => {
        const score = scoreEscapeDirection(candidate.x, candidate.y, threatPoint);
        if (score > bestScore) {
          bestScore = score;
          best = candidate;
        }
      });
      if (!best || bestScore < -999) return normalizeVector(-base.y, base.x);
      return best;
    }

    function willDirectionHitObstacle(dirX, dirY) {
      const radius = state.mouse.size / 2;
      const lookAhead = radius + 34 + state.mouse.dangerMeter * 18;
      return isPositionBlocked(state.mouse.x + dirX * lookAhead, state.mouse.y + dirY * lookAhead, radius);
    }

    function scoreEscapeDirection(dirX, dirY, threatPoint) {
      const radius = state.mouse.size / 2;
      const lookAhead = radius + 42;
      const nextX = state.mouse.x + dirX * lookAhead;
      const nextY = state.mouse.y + dirY * lookAhead;
      if (isPositionBlocked(nextX, nextY, radius)) return -1000;
      const futureDist = distance({ x: nextX, y: nextY }, threatPoint);
      const centerDist = distance({ x: nextX, y: nextY }, { x: state.roomWidth / 2, y: state.roomHeight / 2 });
      return futureDist - centerDist * 0.04 + Math.random() * 8;
    }

    function rotateVector(x, y, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return normalizeVector(x * cos - y * sin, x * sin + y * cos);
    }

    function normalizeVector(x, y) {
      const len = Math.hypot(x, y) || 1;
      return { x: x / len, y: y / len };
    }

    function updateMouseStuckState(dt, beforeX, beforeY) {
      const moved = Math.hypot(state.mouse.x - beforeX, state.mouse.y - beforeY);
      if (moved < 1.1) {
        state.mouse.stuckTimer += dt;
      } else {
        state.mouse.stuckTimer = Math.max(0, state.mouse.stuckTimer - dt * 2);
      }

      if (state.mouse.stuckTimer > 0.3) {
        chooseMouseEscapeDirection();
        state.mouse.stuckTimer = 0;
      }
    }

    function chooseMouseEscapeDirection() {
      const centerBiasX = state.roomWidth / 2 - state.mouse.x;
      const centerBiasY = state.roomHeight / 2 - state.mouse.y;
      const angle = Math.atan2(centerBiasY, centerBiasX) + (Math.random() - 0.5) * Math.PI;
      state.mouse.dirX = Math.cos(angle);
      state.mouse.dirY = Math.sin(angle);
      state.mouse.wanderTimer = 0.35 + Math.random() * 0.35;
      state.mouse.blockedCount = 0;
    }

    function checkCatch() {
      if (state.mouse.tunneling || state.mouse.protectionTimer > 0) return;
      const dist = distance(centerOf(state.cat), centerOf(state.mouse));
      if (dist <= state.config.catchDistance) {
        finishGame(true);
      }
    }

    function checkCountdownBeep() {
      const second = Math.ceil(state.timeLeft);
      if (second <= 5 && second > 0 && second !== state.lastBeepSecond) {
        state.lastBeepSecond = second;
        playSound("tick");
      }
    }

    function finishGame(won) {
      if (state.finished) return;
      state.finished = true;
      state.running = false;
      state.gameState = won ? "victory" : "failed";
      clearOpeningCountdown();
      cancelAnimationFrame(state.rafId);
      resetJoystick();
      state.mouse.tunneling = false;
      state.mouse.tunnelScale = 1;
      state.mouse.tunnelOpacity = 1;
      state.mouse.protectionTimer = 0;
      state.cat.isDashing = false;
      state.cat.dashTimer = 0;
      catEl.classList.remove("dashing");
      mouseEl.style.animationPlayState = "paused";
      mouseEl.classList.remove("tunneling", "protected");
      updateDashButton();
      render();
      if (won) {
        state.score = calculateScore();
        const bestResult = state.gameMode === "level" ? saveLevelResult() : saveBestScore();
        playSound("win");
        vibrate([80, 40, 120]);
        render();
        createCatchParticles();
        state.endTimer = window.setTimeout(() => {
          if (!state.finished || state.screen !== "game") return;
          showEndWin(bestResult);
          showScreen("end");
        }, 800);
      } else {
        playSound("lose");
        vibrate(200);
        showEndLose();
        showScreen("end");
      }
    }

    function calculateScore() {
      return Math.round((1000 + Math.ceil(state.timeLeft) * 80) * state.config.multiplier);
    }

    function showEndWin(bestResult) {
      if (state.gameMode === "level") {
        showLevelWin(bestResult);
        return;
      }
      nextLevelBtn.classList.add("hidden");
      replayLevelBtn.classList.add("hidden");
      againBtn.classList.remove("hidden");
      againBtn.textContent = "再玩一次";
      endTitle.textContent = "抓到天蓝了！";
      const used = state.elapsed.toFixed(1);
      const left = state.timeLeft.toFixed(1);
      const rating = getRating();
      const bestText = bestResult.updated ? "新纪录！" : "未刷新最佳成绩";
      resultCard.innerHTML = `
        <div>用时：${used} 秒</div>
        <div>剩余时间：${left} 秒</div>
        <div>本局分数：${state.score}</div>
        <div>本局评级：<strong>${rating} 级捕手</strong></div>
        <strong>${bestText}</strong>
      `;
    }

    function getRating() {
      const ratio = state.timeLeft / state.config.time;
      if (ratio >= 0.6) return "S";
      if (ratio >= 0.4) return "A";
      if (ratio >= 0.2) return "B";
      return "C";
    }

    function currentLevelLabel() {
      const level = levels[state.currentLevelIndex];
      return `第 ${level.id} 关：${level.name}`;
    }

    function saveLevelResult() {
      loadLevelProgress();
      const level = levels[state.currentLevelIndex];
      const rating = getRating();
      const stars = getLevelStars();
      const used = Number(state.elapsed.toFixed(2));
      const current = state.levelProgress.levelBest[level.id];
      const scoreRecord = !current || state.score > current.score;
      const timeRecord = !current || used < current.fastest;
      const starRecord = !current || stars > (current.stars || 0);
      const updated = scoreRecord || timeRecord || starRecord;
      if (updated) {
        state.levelProgress.levelBest[level.id] = {
          score: Math.max(state.score, current ? current.score : 0),
          fastest: current ? Math.min(used, current.fastest) : used,
          stars: current ? Math.max(stars, current.stars || 0) : stars
        };
      }

      state.levelProgress.bestLevelReached = Math.max(state.levelProgress.bestLevelReached || 1, level.id);
      if (level.id < levels.length) {
        state.levelProgress.highestUnlockedLevel = Math.max(state.levelProgress.highestUnlockedLevel, level.id + 1);
      }

      if (state.campaignRun) {
        state.runTotalScore += state.score;
        state.runTotalTime += used;
        state.runStars += stars;
        state.runRatings.push(rating);
      }

      let totalRecord = false;
      if (state.campaignRun && state.currentLevelIndex === levels.length - 1 && state.runTotalScore > (state.levelProgress.bestTotalScore || 0)) {
        state.levelProgress.bestTotalScore = state.runTotalScore;
        totalRecord = true;
      }
      saveLevelProgress();
      return { updated, totalRecord, scoreRecord, timeRecord, starRecord, stars };
    }

    function getFinalRating() {
      const values = { S: 4, A: 3, B: 2, C: 1 };
      if (state.runRatings.length === levels.length && state.runRatings.every(rating => rating === "S")) return "SSS";
      const avg = state.runRatings.reduce((sum, rating) => sum + values[rating], 0) / Math.max(1, state.runRatings.length);
      if (avg >= 3) return "A";
      if (avg >= 2) return "B";
      return "C";
    }

    function showEndLose() {
      if (state.gameMode === "level") {
        endTitle.textContent = "时间到了，天蓝逃走了！";
        resultCard.innerHTML = `<div>当前关卡：${currentLevelLabel()}</div>`;
        nextLevelBtn.classList.add("hidden");
        replayLevelBtn.classList.remove("hidden");
        againBtn.classList.add("hidden");
        return;
      }
      nextLevelBtn.classList.add("hidden");
      replayLevelBtn.classList.add("hidden");
      againBtn.classList.remove("hidden");
      againBtn.textContent = "再试一次";
      endTitle.textContent = "时间到了，天蓝逃走了！";
      resultCard.innerHTML = `
        <div>本局难度：${state.config.label}</div>
        <div>再试一次，姑姑差一点就追上了。</div>
      `;
    }

    function showLevelWin(bestResult) {
      const level = levels[state.currentLevelIndex];
      const used = state.elapsed.toFixed(1);
      const left = state.timeLeft.toFixed(1);
      const rating = getRating();
      const isFinal = state.currentLevelIndex === levels.length - 1;
      const fullClear = isFinal && state.campaignRun;
      replayLevelBtn.classList.remove("hidden");
      againBtn.classList.add("hidden");

      if (fullClear) {
        const finalRating = getFinalRating();
        endTitle.textContent = "恭喜通关！";
        resultCard.innerHTML = `
          <div>总得分：${state.runTotalScore}</div>
          <div>总星级：<strong class="stars">${"★".repeat(state.runStars)}${"☆".repeat(levels.length * 3 - state.runStars)}</strong> ${state.runStars} / ${levels.length * 3}</div>
          <div>总用时：${state.runTotalTime.toFixed(1)} 秒</div>
          <div>最终评级：<strong>${finalRating}</strong></div>
          <strong>${bestResult.totalRecord ? "新纪录！" : "完成挑战！"}</strong>
        `;
        nextLevelBtn.classList.add("hidden");
        replayLevelBtn.classList.add("hidden");
        againBtn.textContent = "再玩一次";
        againBtn.classList.remove("hidden");
      } else {
        endTitle.textContent = "抓到天蓝了！";
        resultCard.innerHTML = `
          <div>当前关卡：${currentLevelLabel()}</div>
          <div>用时：${used} 秒</div>
          <div>剩余时间：${left} 秒</div>
          <div>本关得分：${state.score}</div>
          <div>本关星级：<strong class="stars">${formatStars(bestResult.stars)}</strong></div>
          <div>评级：<strong>${rating} 级捕手</strong></div>
          <strong>${bestResult.starRecord ? "新星级纪录！" : "继续前进！"}</strong>
          <div>${bestResult.scoreRecord ? "刷新最佳分数" : "最佳分数未刷新"}｜${bestResult.timeRecord ? "刷新最快时间" : "最快时间未刷新"}</div>
        `;
        nextLevelBtn.classList.toggle("hidden", isFinal);
      }
    }

    function createCatchParticles() {
      particleLayer.innerHTML = "";
      const colors = ["#ffd166", "#ef476f", "#78d39c", "#4cc9f0", "#ff9f6e", "#fff1a8"];
      const center = centerOf(state.mouse);
      for (let i = 0; i < 22; i += 1) {
        const particle = document.createElement("span");
        const angle = Math.random() * Math.PI * 2;
        const distance = 34 + Math.random() * 56;
        const size = 7 + Math.random() * 10;
        particle.className = `particle ${i % 4 === 0 ? "star" : ""}`;
        particle.style.left = `${center.x}px`;
        particle.style.top = `${center.y}px`;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.background = colors[i % colors.length];
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        particleLayer.appendChild(particle);
      }
      window.setTimeout(() => {
        particleLayer.innerHTML = "";
      }, 900);
    }

    function render() {
      const remain = Math.ceil(state.timeLeft);
      timePill.textContent = `时间 ${remain}`;
      timePill.classList.toggle("time-warning", remain <= 5 && state.running);
      scorePill.textContent = `分数 ${state.finished ? state.score : estimateScore()}`;
      const catDashScale = state.cat.isDashing ? 1.08 : 1;
      catEl.style.transform = `translate3d(${state.cat.x}px, ${state.cat.y}px, 0) translate(-50%, -50%) scaleX(${state.cat.facing}) scale(${catDashScale}) rotate(${state.cat.angle}rad)`;
      const sprintScale = state.mouse.sprinting ? 1.12 : 1;
      const tunnelScale = state.mouse.tunneling ? state.mouse.tunnelScale : 1;
      mouseEl.style.opacity = state.mouse.tunneling ? String(state.mouse.tunnelOpacity) : "";
      mouseEl.style.transform = `translate3d(${state.mouse.x}px, ${state.mouse.y}px, 0) translate(-50%, -50%) scale(${sprintScale * tunnelScale})`;
      catStatus.textContent = `姑姑加速 ${state.cat.speedBoostTimer.toFixed(1)}s`;
      catStatus.classList.toggle("hidden", state.cat.speedBoostTimer <= 0);
      mouseStatus.textContent = `天蓝加速 ${state.mouse.cheeseBoostTimer.toFixed(1)}s`;
      mouseStatus.classList.toggle("hidden", state.mouse.cheeseBoostTimer <= 0);
      updateDashButton();
    }

    function updateDashButton() {
      if (!dashBtn) return;
      const activeGame = state.screen === "game" && !state.finished;
      const dashEnabled = Boolean(state.config.catDashEnabled);
      dashBtn.classList.toggle("hidden", !activeGame || !dashEnabled);
      dashBtn.disabled = !activeGame || !dashEnabled || state.paused || !state.running || state.cat.dashCooldownTimer > 0 || state.cat.isDashing;
      dashBtn.classList.toggle("dashing", state.cat.isDashing);
      dashBtn.classList.toggle("cooldown", state.cat.dashCooldownTimer > 0 && !state.cat.isDashing);
      dashBtn.classList.toggle("disabled", !activeGame || state.paused || !state.running);
      dashBtn.classList.toggle("ready", activeGame && state.running && !state.paused && state.cat.dashCooldownTimer <= 0 && !state.cat.isDashing);
      if (!activeGame || !dashEnabled || state.paused || !state.running) {
        dashBtn.textContent = "冲刺";
      } else if (state.cat.isDashing) {
        dashBtn.textContent = "冲！";
      } else if (state.cat.dashCooldownTimer > 0) {
        dashBtn.textContent = `${state.cat.dashCooldownTimer.toFixed(1)}s`;
      } else {
        dashBtn.textContent = "冲刺";
      }
    }

    function estimateScore() {
      return Math.round((1000 + Math.ceil(state.timeLeft) * 80) * state.config.multiplier);
    }

    function clampToRoom(entity) {
      const radius = entity.size / 2;
      const nextX = Math.max(radius, Math.min(state.roomWidth - radius, entity.x));
      const nextY = Math.max(radius, Math.min(state.roomHeight - radius, entity.y));
      const hit = { x: nextX !== entity.x, y: nextY !== entity.y };
      entity.x = nextX;
      entity.y = nextY;
      return hit;
    }

    function approach(current, target, amount) {
      if (current < target) return Math.min(current + amount, target);
      if (current > target) return Math.max(current - amount, target);
      return target;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function easeInOut(t) {
      return t * t * (3 - 2 * t);
    }

    function centerOf(entity) {
      return { x: entity.x, y: entity.y };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function userFeedback(type) {
      ensureAudio();
      playSound(type);
      vibrate(20);
    }

    function ensureAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioContext) audioContext = new AudioCtor();
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function playSound(type) {
      if (!audioContext) return;
      const now = audioContext.currentTime;
      const sounds = {
        click: [{ f: 520, t: 0, d: 0.055, g: 0.05 }],
        start: [{ f: 540, t: 0, d: 0.08, g: 0.06 }, { f: 760, t: 0.09, d: 0.09, g: 0.06 }],
        dash: [{ f: 420, t: 0, d: 0.055, g: 0.055 }, { f: 760, t: 0.045, d: 0.08, g: 0.065 }],
        tick: [{ f: 880, t: 0, d: 0.07, g: 0.045 }],
        win: [{ f: 620, t: 0, d: 0.11, g: 0.07 }, { f: 820, t: 0.11, d: 0.12, g: 0.07 }, { f: 1040, t: 0.24, d: 0.18, g: 0.08 }],
        lose: [{ f: 260, t: 0, d: 0.18, g: 0.07 }, { f: 190, t: 0.19, d: 0.24, g: 0.07 }]
      };
      (sounds[type] || sounds.click).forEach(note => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(note.f, now + note.t);
        gain.gain.setValueAtTime(0, now + note.t);
        gain.gain.linearRampToValueAtTime(note.g, now + note.t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(now + note.t);
        osc.stop(now + note.t + note.d + 0.02);
      });
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function saveBestScore() {
      const key = `catMouseBest_${state.selectedDifficulty}`;
      const current = JSON.parse(localStorage.getItem(key) || "null");
      const next = {
        score: state.score,
        fastest: Number(state.elapsed.toFixed(2))
      };
      const updated = !current || state.score > current.score || state.elapsed < current.fastest;
      if (updated) {
        localStorage.setItem(key, JSON.stringify({
          score: Math.max(next.score, current ? current.score : 0),
          fastest: current ? Math.min(next.fastest, current.fastest) : next.fastest
        }));
      }
      loadBestScore();
      return { updated };
    }

    function loadBestScore() {
      const key = `catMouseBest_${state.selectedDifficulty}`;
      const data = JSON.parse(localStorage.getItem(key) || "null");
      const label = difficulties[state.selectedDifficulty].label;
      if (!data) {
        bestCard.textContent = `${label}最佳成绩：暂无记录`;
      } else {
        bestCard.textContent = `${label}最佳成绩：${data.score} 分，最快 ${data.fastest.toFixed(1)} 秒`;
      }
      updateLevelProgressCard();
      return data;
    }

    function resetJoystick() {
      state.input.active = false;
      state.input.id = null;
      state.input.x = 0;
      state.input.y = 0;
      state.input.power = 0;
      stick.style.transform = "translate(-50%, -50%)";
    }

    function refreshRoomBounds() {
      if (state.screen === "game") {
        measureRoom();
        createObstacles();
        createTunnels();
        moveEntityToNearestSafe(state.cat, "cat");
        moveEntityToNearestSafe(state.mouse, "mouse");
        validateItemsAfterResize();
        render();
      }
    }

    window.addEventListener("resize", refreshRoomBounds);
    window.addEventListener("orientationchange", () => {
      window.setTimeout(refreshRoomBounds, 120);
    });

    initGame();
  </script>
</body>
</html>
