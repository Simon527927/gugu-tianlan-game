<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>姑姑抓天蓝</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #f9efe2;
      color: #553c2c;
    }

    button {
      border: 0;
      border-radius: 14px;
      min-height: 46px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      color: #563a24;
      background: #ffd166;
      box-shadow: 0 5px 0 #d99236, 0 8px 18px rgba(73, 47, 22, 0.15);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d99236, 0 5px 12px rgba(73, 47, 22, 0.12);
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.55), transparent 22%),
        linear-gradient(180deg, #fff3df 0%, #f7dec1 100%);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    }

    .screen.active {
      display: flex;
    }

    .menu-screen,
    .end-screen,
    .level-screen {
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: clamp(38px, 12vw, 58px);
      line-height: 1.05;
      color: #e56b3c;
      text-shadow: 0 4px 0 #ffe0a8;
    }

    .subtitle,
    .best-card,
    .result-card {
      margin: 0 auto;
      max-width: 360px;
      line-height: 1.6;
      font-size: 15px;
    }

    .best-card,
    .result-card {
      width: 100%;
      border: 3px solid rgba(121, 82, 48, 0.18);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 252, 244, 0.76);
      box-shadow: 0 10px 22px rgba(110, 72, 34, 0.12);
    }

    .difficulty-row,
    .button-stack,
    .level-list {
      display: grid;
      gap: 12px;
      width: min(100%, 360px);
      margin: 0 auto;
    }

    .difficulty-row {
      grid-template-columns: repeat(3, 1fr);
    }

    .difficulty-btn {
      padding: 10px 8px;
      min-height: 44px;
      background: #fff6d8;
      box-shadow: inset 0 0 0 2px rgba(130, 89, 49, 0.18), 0 4px 0 #dcc58e;
      font-size: 14px;
    }

    .difficulty-btn.selected {
      background: #ffb84d;
      color: #4b2b16;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55), 0 4px 0 #c98228;
    }

    .level-card {
      min-height: 58px;
      padding: 10px 12px;
      border-radius: 14px;
      display: grid;
      gap: 3px;
      text-align: left;
      background: rgba(255, 252, 244, 0.86);
      border: 2px solid rgba(121, 82, 48, 0.18);
      box-shadow: 0 5px 0 #dcc58e, 0 8px 18px rgba(73, 47, 22, 0.12);
    }

    .level-card.locked {
      opacity: 0.55;
      filter: grayscale(0.45);
    }

    .level-card strong {
      font-size: 15px;
      color: #563a24;
    }

    .level-card span {
      font-size: 12px;
      font-weight: 700;
      color: rgba(85, 60, 44, 0.78);
    }

    .stars {
      color: #f5a400;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 0 2px 0 rgba(101, 65, 26, 0.12);
    }

    .primary-btn {
      background: #78d39c;
      box-shadow: 0 5px 0 #3a9c66, 0 8px 18px rgba(25, 96, 60, 0.18);
    }

    .secondary-btn {
      background: #bde0fe;
      box-shadow: 0 5px 0 #6aa7d8, 0 8px 18px rgba(37, 93, 133, 0.14);
    }

    .game-screen {
      padding: 0;
      overflow: hidden;
    }

    .game-screen.active {
      display: block;
    }

    .top-ui {
      position: absolute;
      left: 10px;
      right: 10px;
      top: max(8px, env(safe-area-inset-top));
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      z-index: 9;
    }

    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      min-height: 30px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255, 250, 239, 0.86);
      border: 2px solid rgba(113, 77, 44, 0.12);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(111, 73, 34, 0.08);
    }

    .time-warning {
      color: #e63946;
      background: #ffe3a3;
      font-size: 18px;
      border-color: rgba(230, 57, 70, 0.28);
      animation: pulse 0.55s infinite alternate;
    }

    .small-btn {
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 13px;
    }

    .room-wrap {
      position: absolute;
      left: 10px;
      right: 10px;
      top: max(68px, calc(env(safe-area-inset-top) + 62px));
      bottom: max(10px, env(safe-area-inset-bottom));
      min-height: 0;
    }

    .room {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      border: 12px solid #93643d;
      border-radius: 18px;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(0deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px) 0 0 / 42px 42px,
        #f3c990;
      box-shadow:
        inset 0 0 0 5px rgba(255, 242, 211, 0.75),
        inset 0 0 30px rgba(116, 70, 30, 0.18),
        0 12px 28px rgba(90, 58, 24, 0.2);
    }

    .rug {
      position: absolute;
      left: 50%;
      top: 56%;
      width: 48%;
      height: 26%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-radial-gradient(circle, #f08a7d 0 12px, #ffd6a5 13px 24px);
      opacity: 0.42;
    }

    .window,
    .cabinet {
      position: absolute;
      pointer-events: none;
      opacity: 0.72;
    }

    .window {
      right: 18px;
      top: 20px;
      width: 76px;
      height: 52px;
      border: 6px solid #76b7d8;
      border-radius: 10px;
      background: linear-gradient(135deg, #d8f3ff, #fff9c7);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55);
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: #76b7d8;
    }

    .window::before {
      left: 50%;
      top: 0;
      width: 5px;
      height: 100%;
      transform: translateX(-50%);
    }

    .window::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 5px;
      transform: translateY(-50%);
    }

    .cabinet {
      left: 18px;
      top: 24px;
      width: 68px;
      height: 42px;
      border-radius: 8px;
      background: #be7b4b;
      box-shadow: inset 0 -8px 0 rgba(73, 35, 17, 0.15);
    }

    .cabinet::before,
    .cabinet::after {
      content: "";
      position: absolute;
      top: 17px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffe2a3;
    }

    .cabinet::before { left: 20px; }
    .cabinet::after { right: 20px; }

    .obstacles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .obstacle {
      position: absolute;
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 8px 14px rgba(83, 48, 20, 0.2), inset 0 4px 0 rgba(255, 255, 255, 0.22);
      transform: translateZ(0);
    }

    .obstacle::before,
    .obstacle::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .obstacle-sofa {
      background: linear-gradient(180deg, #f08a7d 0%, #d95f57 100%);
      border: 4px solid #9c453e;
    }

    .obstacle-sofa::before {
      left: 8%;
      right: 8%;
      top: 8px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 232, 199, 0.32);
    }

    .obstacle-sofa::after {
      left: 12%;
      right: 12%;
      bottom: -5px;
      height: 9px;
      border-radius: 0 0 10px 10px;
      background: #8d3c36;
    }

    .obstacle-table {
      background:
        linear-gradient(90deg, rgba(255, 231, 183, 0.18) 1px, transparent 1px) 0 0 / 14px 14px,
        linear-gradient(180deg, #c8844c 0%, #a76335 100%);
      border: 4px solid #6f4224;
      border-radius: 14px;
    }

    .obstacle-table::before {
      inset: 9px;
      border: 2px solid rgba(255, 237, 195, 0.36);
      border-radius: 10px;
    }

    .obstacle-cabinet {
      background: linear-gradient(180deg, #b87343 0%, #89512f 100%);
      border: 4px solid #60351f;
    }

    .obstacle-cabinet::before {
      left: 50%;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 999px;
      background: rgba(74, 37, 18, 0.35);
    }

    .obstacle-cabinet::after {
      left: 50%;
      top: 50%;
      width: 18px;
      height: 7px;
      border-radius: 999px;
      background: #ffd89a;
      transform: translate(-50%, -50%);
      box-shadow: 0 -24px 0 #ffd89a, 0 24px 0 #ffd89a;
    }

    .tunnels-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .tunnel {
      position: absolute;
      width: 52px;
      height: 42px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(ellipse at center, #1f1a20 0 42%, #4a3b4d 43% 62%, #a46f54 63% 100%);
      border: 3px solid rgba(87, 54, 38, 0.9);
      box-shadow: 0 8px 14px rgba(48, 28, 20, 0.28), inset 0 4px 10px rgba(255, 224, 167, 0.18);
      animation: tunnelBreath 1.8s ease-in-out infinite alternate;
    }

    .tunnel::after {
      content: "秘密通道";
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translate(-50%, 2px);
      min-width: 58px;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(255, 248, 225, 0.86);
      color: #5b3927;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(67, 39, 20, 0.16);
    }

    .items-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .item {
      position: absolute;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: 24px;
      animation: itemFloat 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 6px 7px rgba(54, 32, 16, 0.25));
    }

    .item-speed-shoe {
      background: radial-gradient(circle at 35% 28%, #fff7b0 0 28%, #4cc9f0 62%, #3a86ff 100%);
      border: 3px solid rgba(255, 255, 255, 0.72);
    }

    .item-cheese {
      background: radial-gradient(circle at 35% 28%, #fff7a1 0 24%, #ffd166 58%, #f77f00 100%);
      border: 3px solid rgba(255, 255, 255, 0.72);
      animation: itemFloat 1s ease-in-out infinite alternate, cheeseGlow 0.8s ease-in-out infinite alternate;
    }

    .sprite {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transform: translate3d(0, 0, 0) translate(-50%, -50%);
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform-origin: center center;
      z-index: 5;
    }

    .sprite::after {
      content: "";
      position: absolute;
      z-index: -1;
      bottom: -6px;
      width: 68%;
      height: 18%;
      border-radius: 50%;
      background: rgba(80, 44, 20, 0.22);
      filter: blur(2px);
    }

    .sprite img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.25));
    }

    .sprite-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
    }

    .sprite.image-failed img {
      display: none;
    }

    .sprite.image-failed .sprite-fallback {
      display: grid;
    }

    .cat {
      width: 56px;
      height: 56px;
      transition: filter 120ms ease;
    }

    .cat.dashing {
      filter: drop-shadow(0 0 12px rgba(255, 214, 102, 0.82)) drop-shadow(-12px 7px 5px rgba(255, 159, 110, 0.34));
    }

    .cat.dashing::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid rgba(255, 209, 102, 0.62);
      animation: dashAura 0.22s ease-out infinite alternate;
      pointer-events: none;
    }

    .cat.speed-boosted {
      filter: drop-shadow(0 0 12px rgba(76, 201, 240, 0.75)) drop-shadow(-10px 7px 5px rgba(58, 134, 255, 0.25));
    }

    .cat-face {
      position: relative;
      width: 48px;
      height: 44px;
      border-radius: 50% 50% 46% 46%;
      background: #f5a64f;
      border: 3px solid #7f5126;
      box-shadow: inset 0 -5px 0 rgba(111, 63, 25, 0.12);
    }

    .cat-ear {
      position: absolute;
      top: -13px;
      width: 20px;
      height: 22px;
      background: #f5a64f;
      border: 3px solid #7f5126;
      transform: rotate(45deg);
      border-radius: 4px;
      z-index: -1;
    }

    .cat-ear.left { left: 4px; }
    .cat-ear.right { right: 4px; }

    .cat-ear::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 3px;
      background: #ffd1b6;
    }

    .cat-eye {
      position: absolute;
      top: 15px;
      width: 6px;
      height: 8px;
      border-radius: 50%;
      background: #372719;
    }

    .cat-eye.left { left: 13px; }
    .cat-eye.right { right: 13px; }

    .cat-nose {
      position: absolute;
      left: 50%;
      top: 25px;
      width: 8px;
      height: 6px;
      border-radius: 50% 50% 60% 60%;
      background: #7f3f31;
      transform: translateX(-50%);
    }

    .cat-whisker {
      position: absolute;
      top: 28px;
      width: 17px;
      height: 2px;
      background: #7f5126;
      border-radius: 999px;
    }

    .cat-whisker.left { left: -8px; }
    .cat-whisker.right { right: -8px; }
    .cat-whisker.left.top { transform: translateY(-5px) rotate(12deg); }
    .cat-whisker.left.bottom { transform: translateY(5px) rotate(-12deg); }
    .cat-whisker.right.top { transform: translateY(-5px) rotate(-12deg); }
    .cat-whisker.right.bottom { transform: translateY(5px) rotate(12deg); }

    .cat-tail {
      position: absolute;
      right: -5px;
      bottom: 5px;
      width: 24px;
      height: 12px;
      border: 4px solid #7f5126;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 14px 0 0;
      transform: rotate(35deg);
      transform-origin: left center;
    }

    .mouse {
      width: 40px;
      height: 40px;
      animation: mouseWiggle 0.33s infinite alternate ease-in-out;
    }

    .mouse-body {
      position: relative;
      width: 34px;
      height: 28px;
      border-radius: 50% 56% 52% 48%;
      background: #b8a7a0;
      border: 3px solid #675a55;
      box-shadow: inset -4px -4px 0 rgba(79, 63, 57, 0.12);
    }

    .mouse-ear {
      position: absolute;
      top: -9px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #b8a7a0;
      border: 3px solid #675a55;
      z-index: -1;
    }

    .mouse-ear.left { left: 3px; }
    .mouse-ear.right { right: 4px; }

    .mouse-ear::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #f1b6bc;
    }

    .mouse-eye {
      position: absolute;
      top: 9px;
      right: 10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2f2927;
    }

    .mouse-nose {
      position: absolute;
      top: 13px;
      right: -6px;
      width: 9px;
      height: 7px;
      border-radius: 50%;
      background: #e06775;
      border: 2px solid #675a55;
    }

    .mouse-tail {
      position: absolute;
      left: -17px;
      bottom: 7px;
      width: 22px;
      height: 12px;
      border-left: 3px solid #d88995;
      border-bottom: 3px solid #d88995;
      border-radius: 0 0 0 18px;
      transform: rotate(12deg);
    }

    .mouse.sprinting {
      filter: drop-shadow(-10px 8px 4px rgba(248, 112, 96, 0.34)) drop-shadow(0 8px 7px rgba(73, 43, 20, 0.24));
      animation: mouseWiggle 0.18s infinite alternate ease-in-out;
    }

    .mouse.tunneling {
      filter: drop-shadow(0 0 10px rgba(85, 60, 120, 0.35));
    }

    .mouse.protected {
      animation: mouseProtect 0.16s steps(2, end) infinite;
    }

    .mouse.cheese-boosted {
      filter: drop-shadow(0 0 12px rgba(255, 209, 102, 0.8)) drop-shadow(-10px 7px 5px rgba(247, 127, 0, 0.34));
    }

    .status-pop {
      position: absolute;
      left: 50%;
      top: -24px;
      min-width: 72px;
      padding: 3px 6px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(255, 248, 225, 0.92);
      color: #5b3927;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(67, 39, 20, 0.16);
      white-space: nowrap;
    }

    .particle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }

    .particle {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffd166;
      transform: translate(-50%, -50%);
      animation: burst 800ms ease-out forwards;
      will-change: transform, opacity;
    }

    .particle.star {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      clip-path: polygon(50% 0%, 62% 34%, 98% 35%, 69% 56%, 79% 91%, 50% 70%, 21% 91%, 31% 56%, 2% 35%, 38% 34%);
    }

    .joystick {
      position: absolute;
      left: 18px;
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 118px;
      height: 118px;
      z-index: 8;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      border: 3px solid rgba(103, 70, 40, 0.18);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.45), 0 8px 20px rgba(82, 49, 22, 0.14);
      touch-action: none;
    }

    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #ff9f6e;
      border: 4px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 6px 14px rgba(101, 57, 27, 0.22);
    }

    .dash-btn {
      position: absolute;
      right: 20px;
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px));
      z-index: 9;
      width: 78px;
      height: 78px;
      min-height: 78px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 28%, #fff4ad 0 18%, #ffb84d 42%, #e56b3c 100%);
      border: 4px solid rgba(255, 255, 255, 0.7);
      color: #4d2716;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 7px 0 #b84d2b, 0 12px 22px rgba(96, 45, 20, 0.22);
      touch-action: none;
    }

    .dash-btn.ready {
      animation: dashReady 1s ease-in-out infinite alternate;
    }

    .dash-btn.cooldown,
    .dash-btn.disabled {
      background: #9d9187;
      color: rgba(255, 255, 255, 0.82);
      border-color: rgba(255, 255, 255, 0.36);
      box-shadow: 0 5px 0 #655c57, 0 10px 18px rgba(67, 48, 38, 0.18);
    }

    .dash-btn.dashing {
      background: radial-gradient(circle at 35% 28%, #ffffff 0 18%, #ffe66d 44%, #ff7b54 100%);
    }

    .dash-btn.hint {
      animation: dashHint 0.18s ease-in-out 2;
    }

    .pause-screen {
      align-items: center;
      justify-content: center;
      background: rgba(75, 45, 26, 0.28);
      z-index: 20;
    }

    .modal {
      width: min(92vw, 360px);
      padding: 22px;
      border-radius: 20px;
      background: #fff9ee;
      text-align: center;
